<div class="state" role="status" [attr.aria-live]="kind() === 'error' ? 'assertive' : 'polite'">
  @if (kind() === 'loading') { <span class="spinner" aria-hidden="true"></span> }
  @else { <span class="state-icon" aria-hidden="true">{{ kind() === 'error' ? '!' : '◇' }}</span> }
  <strong>{{ title() || (kind() === 'loading' ? 'Đang tải dữ liệu' : kind() === 'error' ? 'Không thể tải dữ liệu' : 'Chưa có dữ liệu') }}</strong>
  @if (message()) { <p>{{ message() }}</p> }
  @if (kind() === 'error') { <button type="button" class="button secondary" (click)="retry.emit()">Thử lại</button> }
</div>
