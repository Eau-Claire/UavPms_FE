<nav aria-label="Pagination"><span>{{ totalCount() }} records</span><div><button type="button" aria-label="Previous page" [disabled]="page() <= 1" (click)="pageChanged.emit(page() - 1)">‹</button>@for (item of pages(); track item) { <button type="button" [class.active]="item === page()" [attr.aria-current]="item === page() ? 'page' : null" (click)="pageChanged.emit(item)">{{ item }}</button> }<button type="button" aria-label="Next page" [disabled]="page() >= totalPages()" (click)="pageChanged.emit(page() + 1)">›</button></div></nav>
