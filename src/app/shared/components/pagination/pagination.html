<nav aria-label="Phân trang"><span>{{ totalCount() }} bản ghi</span><div><button type="button" aria-label="Trang trước" [disabled]="page() <= 1" (click)="pageChanged.emit(page() - 1)">‹</button>@for (item of pages(); track item) { <button type="button" [class.active]="item === page()" [attr.aria-current]="item === page() ? 'page' : null" (click)="pageChanged.emit(item)">{{ item }}</button> }<button type="button" aria-label="Trang sau" [disabled]="page() >= totalPages()" (click)="pageChanged.emit(page() + 1)">›</button></div></nav>
