<aside class="app-sidebar ant-layout-sider" [class.app-sidebar-mobile]="open()" aria-label="Primary navigation">
  <div class="app-sidebar-brand"><img ngSrc="/images/evn-sidebar-logo.png" width="140" height="54" priority alt="EVN Logo" class="app-sidebar-logo" /></div>
  <nav class="app-sidebar-nav">
    <div class="app-sidebar-nav-primary">
      @for (item of primaryLinks; track item.path) { <a class="app-nav-item" [routerLink]="item.path" routerLinkActive="app-nav-item-active" (click)="closed.emit()"><span nz-icon [nzType]="item.icon" class="app-nav-icon" aria-hidden="true"></span><span class="app-nav-label">{{ item.label }}</span></a> }
    </div>
    <div class="app-sidebar-nav-secondary">
      @for (item of secondaryLinks; track item.path) { <a class="app-nav-item" [routerLink]="item.path" routerLinkActive="app-nav-item-active" (click)="closed.emit()"><span nz-icon [nzType]="item.icon" class="app-nav-icon" aria-hidden="true"></span><span class="app-nav-label">{{ item.label }}</span></a> }
    </div>
  </nav>
</aside>
