<div class="app-shell ant-layout">
  <app-sidebar [open]="sidebarOpen()" (closed)="sidebarOpen.set(false)" />
  @if (sidebarOpen()) { <button type="button" class="app-backdrop" aria-label="Close navigation" (click)="sidebarOpen.set(false)"></button> }
  <div class="app-main ant-layout">
    <app-header (menuOpened)="sidebarOpen.set(true)" />
    <main id="main-content" class="app-content ant-layout-content" tabindex="-1"><div class="app-content-inner"><router-outlet /></div></main>
  </div>
</div>
