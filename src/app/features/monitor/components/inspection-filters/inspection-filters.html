<form [formGroup]="form" (ngSubmit)="apply()"><label><span>Mission</span><input formControlName="missionId" placeholder="Mission ID" /></label><label><span>Defect status</span><select formControlName="defectStatus"><option value="all">All inspections</option><option value="defect">Defect detected</option><option value="clear">No defect</option></select></label><label><span>From date</span><input type="date" formControlName="fromDate" /></label><label><span>To date</span><input type="date" formControlName="toDate" /></label><div class="actions"><button type="button" class="button secondary" (click)="clear()">Clear</button><button type="submit" class="button primary">Apply filters</button></div></form>
