<form [formGroup]="form" (ngSubmit)="apply()">
  <label>
    <span>Mã / Tên nhiệm vụ</span>
    <input
      formControlName="mission"
      list="inspection-mission-options"
      autocomplete="off"
      placeholder="Chọn hoặc nhập mã, tên nhiệm vụ..."
      aria-describedby="inspection-mission-hint"
    />
    <datalist id="inspection-mission-options">
      @for (option of missionOptions(); track option.id) {
        <option [value]="option.label"></option>
      }
    </datalist>
  </label>
  <label>
    <span>Trạng thái sự cố</span>
    <select formControlName="defectStatus">
      <option value="all">Tất cả kiểm tra</option>
      <option value="defect">Phát hiện sự cố</option>
      <option value="clear">Bình thường (Không sự cố)</option>
    </select>
  </label>
  <label>
    <span>Từ ngày</span>
    <input type="date" formControlName="fromDate" />
  </label>
  <label>
    <span>Đến ngày</span>
    <input type="date" formControlName="toDate" />
  </label>
  <div class="actions">
    <button type="button" class="button secondary" (click)="clear()">Xóa lọc</button>
    <button type="submit" class="button primary">Áp dụng</button>
  </div>
  <p id="inspection-mission-hint" class="hint">
    Chọn nhiệm vụ từ danh sách gợi ý (hoặc dán ID nhiệm vụ) để lọc toàn bộ lịch sử. Nội dung khác chỉ lọc theo tên nhiệm vụ trên trang đang xem.
  </p>
</form>
