<div class="status-list">@for (item of data(); track item.status) { <div class="status-row" [attr.data-status]="item.status.toLowerCase()"><div><span class="status-dot" aria-hidden="true"></span><strong>{{ label(item.status) }}</strong><span>{{ item.count }} missions</span><b>{{ percent(item.count) }}%</b></div><div class="track" role="progressbar" [attr.aria-label]="label(item.status)" [attr.aria-valuenow]="percent(item.count)" aria-valuemin="0" aria-valuemax="100"><span [style.width.%]="percent(item.count)"></span></div></div> }</div>
