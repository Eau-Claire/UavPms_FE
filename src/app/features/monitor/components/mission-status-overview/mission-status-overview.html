<div class="status-list">@for (item of data(); track item.status) { <div class="status-row" [attr.data-status]="item.status.toLowerCase()"><div><strong>{{ label(item.status) }}</strong><span class="tabular-nums">{{ item.count }} nhiệm vụ</span><b class="tabular-nums">{{ percent(item.count) }}%</b></div><div class="track" role="progressbar" [attr.aria-label]="label(item.status)" [attr.aria-valuenow]="percent(item.count)" aria-valuemin="0" aria-valuemax="100"><span [style.width.%]="percent(item.count)"></span></div></div> }</div>
