<div class="alerts">@for (alert of alerts().slice(0, limit()); track alert.id) { <article [class.unread]="!alert.isRead"><span class="alert-icon" aria-hidden="true">!</span><div><div class="alert-title"><strong>{{ alert.title }}</strong>@if (!alert.isRead) { <span>New</span> }</div><p>{{ alert.message }}</p><time [attr.datetime]="alert.createdAt">{{ alert.createdAt | date:'MMM d, HH:mm' }}</time></div></article> }</div>
