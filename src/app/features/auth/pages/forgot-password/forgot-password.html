<main class="auth-page simple"><section class="auth-panel"><div class="auth-card"><a class="back" routerLink="/login">← Back to sign in</a><div class="auth-logo">EVN</div><p class="eyebrow">Account recovery</p><h2>Reset your password</h2><p class="subtitle">Enter your work email. We will send a six-digit verification code.</p>@if (error()) { <div class="form-error" role="alert">{{ error() }}</div> }<form [formGroup]="form" (ngSubmit)="submit()"><label><span>Email address</span><input type="email" autocomplete="email" formControlName="email" placeholder="operator@evn.vn" /></label><button type="submit" class="button primary auth-submit" [disabled]="busy()">{{ busy() ? 'Sending…' : 'Send verification code' }}</button></form></div></section></main>
