<section class="settings-page"><div class="panel"><p class="eyebrow">Account security</p><h1>Change password</h1><p>Update the password used to access UAV-PMS.</p>@if (error()) { <div class="form-error" role="alert">{{ error() }}</div> }<form [formGroup]="form" (ngSubmit)="submit()"><label><span>New password</span><input type="password" autocomplete="new-password" formControlName="password" /></label><label><span>Confirm password</span><input type="password" autocomplete="new-password" formControlName="confirm" /></label><button type="submit" class="button primary" [disabled]="busy()">{{ busy() ? 'Saving…' : 'Save password' }}</button></form></div></section>
