<main class="auth-page simple"><section class="auth-panel"><div class="auth-card"><a class="back" routerLink="/login">← Cancel</a><div class="auth-logo">EVN</div><p class="eyebrow">Identity verification</p><h2>Enter verification code</h2><p class="subtitle">A six-digit code was sent to <strong>{{ email || 'your email' }}</strong>.</p>@if (error()) { <div class="form-error" role="alert">{{ error() }}</div> }<form [formGroup]="form" (ngSubmit)="submit()"><label><span>One-time code</span><input class="otp-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" formControlName="otp" placeholder="000000" /></label><button type="submit" class="button primary auth-submit" [disabled]="busy()">{{ busy() ? 'Verifying…' : 'Verify code' }}</button></form></div></section></main>
