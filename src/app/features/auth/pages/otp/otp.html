<main class="auth-split"><section class="auth-brand-panel" aria-label="EVN"><img ngSrc="/images/Logo.png" width="412" height="310" priority alt="EVN Logo" class="auth-brand-logo" /><div class="auth-brand-vi">TẬP ĐOÀN ĐIỆN LỰC VIỆT NAM</div><div class="auth-brand-en">VIETNAM ELECTRICITY</div></section><section class="auth-form-panel"><div class="auth-card auth-card-flow auth-card-otp"><a nz-button nzType="link" class="auth-back-link" routerLink="/login"><span nz-icon nzType="arrow-left"></span>Back</a><header class="auth-flow-header"><h1>Enter OTP</h1><p>The verification code was sent to {{ email }}</p></header><div class="otp-label">ENTER VERIFICATION CODE (OTP)</div>@if (error()) { <div class="auth-alert" role="alert">{{ error() }}</div> }<nz-input-group nzPrefixIcon="mail" class="auth-input otp-email"><input nz-input [value]="email" readonly aria-label="Email" /></nz-input-group><div class="otp-grid" aria-label="One-time password">@for (digit of digits(); track $index) { <input nz-input class="otp-input" inputmode="numeric" maxlength="1" [value]="digit" [attr.aria-label]="'OTP digit ' + ($index + 1)" (input)="updateDigit($index, $event)" /> }</div><div class="otp-meta"><span>3:00</span><button nz-button nzType="link" class="auth-link" type="button">Resend code</button></div><button nz-button nzType="primary" class="evn-primary-button" type="button" [nzLoading]="busy()" (click)="submit()">Verify OTP <span nz-icon nzType="arrow-right"></span></button><p class="auth-muted-note">Do not share your OTP with anyone.</p><p class="auth-copyright">© 2024 Vietnam Electricity (EVN).</p></div></section></main>
