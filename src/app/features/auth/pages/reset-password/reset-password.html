<main class="auth-page simple"><section class="auth-panel"><div class="auth-card"><div class="auth-logo">EVN</div><p class="eyebrow">Account recovery</p><h2>Create a new password</h2><p class="subtitle">Use at least eight characters and avoid reusing your old password.</p>@if (error()) { <div class="form-error" role="alert">{{ error() }}</div> }<form [formGroup]="form" (ngSubmit)="submit()"><label><span>New password</span><input type="password" autocomplete="new-password" formControlName="password" /></label><label><span>Confirm password</span><input type="password" autocomplete="new-password" formControlName="confirm" /></label><button type="submit" class="button primary auth-submit" [disabled]="busy()">{{ busy() ? 'Updating…' : 'Update password' }}</button></form><a class="back centered" routerLink="/login">Return to sign in</a></div></section></main>
