<div class="ops-page forbidden-page-container">
  <section class="forbidden-card">
    <div class="status-code tabular-nums">403</div>
    <h1 class="forbidden-title">Quyền truy cập bị từ chối</h1>
    <p class="forbidden-description">
      Tài khoản của bạn không có đủ thẩm quyền hoặc vai trò phù hợp để truy cập vào tài nguyên này.
    </p>

    <div class="user-role-box">
      <div class="user-info-row">
        <span>Người dùng:</span>
        <strong>{{ user()?.fullName || user()?.email || '—' }}</strong>
      </div>
      <div class="user-info-row">
        <span>Vai trò hiện tại:</span>
        <span class="text-sky-600 font-medium">{{ userRole() }}</span>
      </div>
    </div>

    <div class="forbidden-actions">
      <a routerLink="/dashboard" class="app-btn-primary">Quay lại Trang chủ</a>
      <button type="button" class="app-btn-secondary" (click)="logout()">Đổi tài khoản khác</button>
    </div>
  </section>
</div>
